# =======================================================
# CONFIGURAÇÕES DO SERVIDOR E APLICAÇÃO
# =======================================================
server.port=8082
spring.application.name=flor-da-cidade-api

# =======================================================
# CONFIGURAÇÃO DO BANCO DE DADOS
# Lê as variáveis do .env (carregado pela lib dotenv) ou usa valores padrão.
# =======================================================
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/flor_cidade_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# =======================================================
# DIRETÓRIOS DE UPLOAD
# =======================================================
file.upload-dir.banners=./uploads/banners
file.upload-dir.hortas=./uploads/imagem

# =======================================================
# CONFIGURAÇÕES DE LOG E SESSÃO
# =======================================================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
server.servlet.session.cookie.same-site=Lax

# =======================================================
# CONFIGURAÇÃO DE E-MAIL
# Lê as variáveis do .env (carregado pela lib dotenv) ou usa valores padrão.
# =======================================================
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# =======================================================
# PROPRIEDADES DA APLICAÇÃO
# =======================================================
app.frontend.url=${APP_FRONTEND_URL:http://localhost:5175/admin/}