# =======================================================
# CONFIGURAÇÕES DO SERVIDOR E APLICAÇÃO
# =======================================================
server.port=8082
spring.application.name=flor-da-cidade-api


# =======================================================
# CONFIGURAÇÃO DO BANCO DE DADOS
# (Mantendo seus valores como padrão para desenvolvimento local)
# =======================================================
spring.datasource.url=${DB_URL:jdbc:mysql://146.235.27.82:3306/flor_cidade_db?allowPublicKeyRetrieval=true&useSSL=false}
spring.datasource.username=${DB_USERNAME:flor_user}
spring.datasource.password=${DB_PASSWORD:florWD@2024!}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
# Para produção, a melhor prática é usar 'validate' ou 'none' e gerenciar o schema com ferramentas como Flyway/Liquibase
spring.jpa.hibernate.ddl-auto=update


# =======================================================
# DIRETÓRIOS DE UPLOAD
# =======================================================
file.upload-dir.banners=./uploads/banners
file.upload-dir.hortas=./uploads/imagem


# =======================================================
# CONFIGURAÇÕES DE LOG E SESSÃO
# =======================================================
logging.level.org.springframework.security=INFO
logging.level.org.springframework.web=INFO
server.servlet.session.cookie.same-site=Lax


# =======================================================
# CONFIGURAÇÃO DE E-MAIL
# Lendo as variáveis do seu arquivo .env
# O ':' no final garante que o build não quebre se a variável não for encontrada.
# =======================================================
spring.mail.host=${MAIL_HOST:}
spring.mail.port=${MAIL_PORT:}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true


# =======================================================
# PROPRIEDADES DA APLICAÇÃO
# Lendo as variáveis do seu arquivo .env
# =======================================================
app.frontend.url=${APP_FRONTEND_URL:}
app.mail.from=${APP_MAIL_FROM:}