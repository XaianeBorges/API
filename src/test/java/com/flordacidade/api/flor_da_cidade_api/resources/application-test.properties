# =======================================================
# CONFIGURAÇÃO DO BANCO DE DADOS PARA O AMBIENTE DE TESTE
# =======================================================

# Usamos o banco de dados em memória H2 para testes rápidos e isolados.
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# create-drop: O Hibernate cria todas as tabelas no início dos testes
# e as apaga no final. Isso resolve o erro 'missing table'.
spring.jpa.hibernate.ddl-auto=create-drop


# =======================================================
# CONFIGURAÇÃO DE E-MAIL (MOCK PARA TESTES)
# =======================================================
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=testuser
spring.mail.password=testpass


# =======================================================
# PROPRIEDADES DA APLICAÇÃO (MOCK PARA TESTES)
# =======================================================
app.frontend.url=http://localhost:9999
app.mail.from=test@example.com